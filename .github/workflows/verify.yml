name: Verify
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
    check-secrets:
        uses: ./.github/workflows/check-secrets.yml
        secrets: inherit

    # Runs on every PR, forks included: needs no secrets.
    check:
        name: Check
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
        - name: Checkout
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
          with:
            persist-credentials: false
        - name: Setup workspace
          uses: ./.github/actions/setup-workspace
        - name: Run unit tests
          run: pnpm test:unit
        - name: Audit dependencies
          run: pnpm audit
          continue-on-error: true
        # Non-blocking while criticals remain on the production path: tornado-cash's
        # runtime dep @privacy-paymasters/sdk pulls @pimlico/alto and prool (tar,
        # proxy-addr), and the docs site pulls vocs. Make it blocking once clean.
        - name: Audit production dependencies
          run: pnpm audit --prod --audit-level critical
          continue-on-error: true

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
        - name: Checkout
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
          with:
            persist-credentials: false
        - name: Setup workspace
          uses: ./.github/actions/setup-workspace
          with:
            build-packages: 'true'

    # Sepolia fork e2e: needs RPC secrets, so it is skipped on fork PRs.
    tests:
        name: Tests
        needs: check-secrets
        if: needs.check-secrets.outputs.available == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
        - name: Checkout
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
          with:
            persist-credentials: false
        - name: Setup workspace
          uses: ./.github/actions/setup-workspace
          with:
            build-packages: 'true'
            foundry: 'true'
        - name: Run Privacy Pools tests
          uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
          with:
            timeout_minutes: 20
            max_attempts: 3
            command: pnpm --filter @kohaku-eth/privacy-pools test
          env:
            RPC_URL_MAINNET: ${{ secrets.RPC_URL_MAINNET }}
            RPC_URL_SEPOLIA: ${{ secrets.RPC_URL_SEPOLIA }}
            PPV1_MAINNET_FORK_BLOCK: ${{ secrets.PPV1_MAINNET_FORK_BLOCK }}
            PPV1_SEPOLIA_FORK_BLOCK: ${{ secrets.PPV1_SEPOLIA_FORK_BLOCK }}

        - name: Run Tornado Cash tests
          uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
          with:
            timeout_minutes: 20
            max_attempts: 3
            command: pnpm --filter @kohaku-eth/tornado-cash test
          env:
            RPC_URL_MAINNET: ${{ secrets.RPC_URL_MAINNET }}
            RPC_URL_SEPOLIA: ${{ secrets.RPC_URL_SEPOLIA }}
