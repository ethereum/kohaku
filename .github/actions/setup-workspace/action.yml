name: 'Setup Workspace'
description: 'Sets up Node.js and pnpm, installs dependencies, and optionally Foundry and a package build'

# Packages build with tsc/tsup/vite only, so no Rust, wasm-pack, binaryen or
# just here. Foundry is only for jobs that start anvil (the e2e suites).
inputs:
  build-packages:
    description: 'Whether to build packages'
    required: false
    default: 'true'
  foundry:
    description: 'Whether to install Foundry (anvil) for e2e tests'
    required: false
    default: 'false'
  pnpm-cache:
    description: 'Whether to restore and save the pnpm store cache'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install Foundry
      if: inputs.foundry == 'true'
      uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      with:
        version: v1.4.4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: '11'

    - name: Get pnpm store directory
      if: inputs.pnpm-cache == 'true'
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Cache pnpm store
      if: inputs.pnpm-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile --ignore-scripts

    - name: Build packages
      if: inputs.build-packages == 'true'
      shell: bash
      run: |
        pnpm build
